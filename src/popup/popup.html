<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Helper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div class="brand-mark" aria-hidden="true">P</div>
        <div>
          <h1>Page Helper</h1>
          <p>选择需要同步的网站</p>
        </div>
      </header>

      <section id="site-list" class="site-list" aria-label="网站同步选项"></section>

      <footer class="footer">
        <span id="status" role="status" aria-live="polite">正在读取配置…</span>
      </footer>
    </main>

    <template id="site-option-template">
      <label class="site-option">
        <span class="site-copy">
          <span class="site-label"></span>
          <span class="site-description"></span>
        </span>
        <span class="switch">
          <input class="site-checkbox" type="checkbox" />
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>
    </template>

    <script type="module" src="popup.js"></script>
  </body>
</html>
